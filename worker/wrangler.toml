name = "elara-gemini"
main = "src/index.ts"
compatibility_date = "2026-09-03"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://cryogenized-spec.github.io"
APP_ORIGIN = "https://cryogenized-spec.github.io/Elara-Angelic-Utility-Applet/"
GOOGLE_OAUTH_REDIRECT_URI = "https://elara-gemini.cryogenized.workers.dev/api/google/oauth/callback"

[[kv_namespaces]]
binding = "GOOGLE_OAUTH_KV"
id = "REPLACE_WITH_PRODUCTION_KV_NAMESPACE_ID"

[secrets]
required = ["GEMINI_API_KEY", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "OAUTH_TOKEN_ENCRYPTION_KEY"]
