name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    env:
      VITE_GEMINI_WORKER_URL: ${{ vars.GEMINI_WORKER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify public Gemini Worker configuration
        run: |
          set -euo pipefail
          test -n "$VITE_GEMINI_WORKER_URL" || {
            echo "GEMINI_WORKER_URL repository variable is required for the production Pages build."
            exit 1
          }
          case "$VITE_GEMINI_WORKER_URL" in
            https://*) ;;
            *)
              echo "GEMINI_WORKER_URL must be an HTTPS URL."
              exit 1
              ;;
          esac

      - name: Build
        run: npm run build

      - name: Verify Pages entrypoint
        run: test -f dist/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy Pages artifact
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
