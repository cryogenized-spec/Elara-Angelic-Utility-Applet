name = "elara-gemini"
main = "src/index.ts"
compatibility_date = "2026-09-03"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://cryogenized-spec.github.io"

# Phase B autonomy scheduler: one hourly cron heartbeat (the repair clock —
# the Durable Object's single alarm is the exact per-routine appointment
# mechanism; cron never schedules individual routines), plus the
# per-installation AutonomyEngine Durable Object (SQLite-backed).
[triggers]
crons = ["0 * * * *"]

[durable_objects]
bindings = [{ name = "AUTONOMY", class_name = "AutonomyEngine" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AutonomyEngine"]

# Phase C0: Workflow is the execution plane. Instance id is a hash of runKey;
# the scheduler (DO) remains the only due-time authority.
[[workflows]]
name = "elara-routine-run"
binding = "ROUTINE_RUN"
class_name = "RoutineRunWorkflow"
