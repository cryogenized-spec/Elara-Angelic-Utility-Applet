name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_ORIGIN: https://cryogenized-spec.github.io
  # Public browser configuration, supplied through GitHub repository variables.
  # These are not secrets; Vite intentionally embeds them in the static bundle.
  VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
  VITE_GOOGLE_PICKER_API_KEY: ${{ vars.VITE_GOOGLE_PICKER_API_KEY }}
  VITE_GOOGLE_CLOUD_PROJECT_NUMBER: ${{ vars.VITE_GOOGLE_CLOUD_PROJECT_NUMBER }}

jobs:
  runtime:
    name: Runtime verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"

      - name: Documentation integrity
        run: npm run docs:check

      - name: Verification integrity
        run: npm run verify:gates

      - name: Security & architecture boundary
        run: npm run security:check

      - name: Secret boundary
        run: npm run secrets:check

      - name: Supply-chain boundary
        run: npm run supply-chain:check

      - name: Test quality boundary
        run: npm run test:quality

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck (TS6 primary)
        run: npm run typecheck

      - name: Typecheck (TS7 compatibility)
        run: npm run typecheck:ts7

      - name: Google OAuth lifecycle regression
        run: npm run test:google-oauth-lifecycle

      - name: Unit tests + coverage ratchet
        run: npm run test:coverage

      - name: Worker & Durable Object tests
        run: npm run test:workers

      - name: Validate production Google browser configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VITE_GOOGLE_CLIENT_ID:-}" ]]; then
            echo "::error::VITE_GOOGLE_CLIENT_ID repository variable is required for the production Pages build."
            exit 1
          fi
          if [[ "${VITE_GOOGLE_CLIENT_ID}" != *.apps.googleusercontent.com ]]; then
            echo "::error::VITE_GOOGLE_CLIENT_ID does not look like a Google Web OAuth client ID."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e -- --project=chromium --project=android-portrait --project=onboarding

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Final reliability gate
        run: npm run reliability:check

      - name: Upload certified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  visual-evidence:
    name: Visual evidence
    if: github.event_name == 'pull_request'
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact event commit with comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"

      - name: Install head dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Materialize exact base worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/elara-visual-base" "${{ github.event.pull_request.base.sha }}"

      - name: Install base dependencies
        working-directory: ${{ runner.temp }}/elara-visual-base
        run: npm ci --no-audit --no-fund

      - name: Capture base visual evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/capture-visual-evidence.mjs \
            --target "$RUNNER_TEMP/elara-visual-base" \
            --label before \
            --output "$RUNNER_TEMP/elara-visual-evidence" \
            --port 5174 \
            --source-sha "${{ github.event.pull_request.base.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}"

      - name: Capture head visual evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/capture-visual-evidence.mjs \
            --target "$GITHUB_WORKSPACE" \
            --label after \
            --output "$RUNNER_TEMP/elara-visual-evidence" \
            --port 5175 \
            --source-sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}"

      - name: Upload visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-evidence-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/elara-visual-evidence/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy certified Pages artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
