name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PAGES_ORIGIN: https://cryogenized-spec.github.io

jobs:
  runtime:
    name: Runtime verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Verify runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"

      - name: Verify required foundation documents
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/REPOSITORY_FORENSICS.md
          test -f docs/PRODUCT_BOUNDARY.md
          test -f docs/ARCHITECTURE_DECISION.md
          test -f docs/SYSTEM_BOUNDARIES.md
          test -f .nvmrc
          test -f package.json
          grep -q "One canonical Gemini execution path" README.md
          grep -q "Android portrait" docs/PRODUCT_BOUNDARY.md
          grep -q "One canonical Gemini provider implementation" docs/PRODUCT_BOUNDARY.md
          grep -q "Node.js 24 LTS" docs/ARCHITECTURE_DECISION.md

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e -- --project=chromium --project=android-portrait

      - name: Final reliability gate
        run: npm run reliability:check
