name = "elara-gemini"
main = "src/entry.ts"
compatibility_date = "2026-09-03"
workers_dev = true
preview_urls = false

[vars]
# This repository's Pages origin. Self-hosted forks must replace this with the
# exact origin of their own PWA (scheme + host + optional port, no path).
ALLOWED_ORIGINS = "https://cryogenized-spec.github.io"

# Google OAuth belongs to the person deploying the fork, not to a shared Elara
# service. Provision these with `wrangler secret put` on that user's Worker:
# GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, GOOGLE_OAUTH_VAULT_KEY.
# GOOGLE_OAUTH_CLIENT_ID must match the browser VITE_GOOGLE_CLIENT_ID from that
# same Google Web OAuth client. The vault key must be high-entropy and at least
# 32 characters. Refresh tokens are AES-GCM encrypted before DO persistence.

# Phase B autonomy scheduler: one hourly cron heartbeat (the repair clock —
# the Durable Object's single alarm is the exact per-routine appointment
# mechanism; cron never schedules individual routines), plus the
# per-installation AutonomyEngine Durable Object (SQLite-backed).
[triggers]
crons = ["0 * * * *"]

[durable_objects]
bindings = [
  { name = "AUTONOMY", class_name = "AutonomyEngine" },
  { name = "GOOGLE_OAUTH", class_name = "GoogleOAuthVault" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AutonomyEngine"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GoogleOAuthVault"]

# Phase C0: Workflow is the execution plane. Instance id is a hash of runKey;
# the scheduler (DO) remains the only due-time authority.
[[workflows]]
name = "elara-routine-run"
binding = "ROUTINE_RUN"
class_name = "RoutineRunWorkflow"
