name: Phase 3 coverage baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  baseline:
    name: Generate exact Phase 3 baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Remove final source-text tail from MediaCard behavior suite
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/app/components/media/MediaCard.test.tsx')
          source = path.read_text()
          source = source.replace("import { readFileSync } from 'node:fs';\n", '')
          source = source.replace("import { resolve } from 'node:path';\n", '')
          source = source.replace("const cssSheet = readFileSync(resolve(process.cwd(), 'src/app/components/media/media-card.css'), 'utf8');\n", '')
          marker = "\ndescribe('MediaCard stylesheet contract', () => {"
          if marker not in source:
              raise SystemExit('MediaCard stylesheet contract marker not found')
          source = source.split(marker, 1)[0].rstrip() + '\n'
          path.write_text(source)

      - name: Install generated dependency graph
        run: npm ci --no-audit --no-fund

      - name: Verify structural test boundary
        run: node scripts/test-quality-gate.mjs

      - name: Measure cleaned unit coverage
        run: npm run test:coverage

      - name: Upload measured coverage
        uses: actions/upload-artifact@v4
        with:
          name: phase3-final-baseline
          path: coverage/coverage-summary.json
          retention-days: 2
          if-no-files-found: error

      - name: Commit generated lock and cleaned behavior suite; remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/app/components/media/MediaCard.test.tsx
          git rm .github/workflows/phase3-baseline.yml
          git commit -m "phase3: finalize coverage dependency baseline"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
