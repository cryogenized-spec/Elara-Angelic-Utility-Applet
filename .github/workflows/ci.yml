name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_ORIGIN: https://cryogenized-spec.github.io

jobs:
  runtime:
    name: Runtime verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(node --version)" = "v24.21.0"

      - name: Documentation integrity
        run: npm run docs:check

      - name: Verification integrity
        run: npm run verify:gates

      - name: Security & architecture boundary
        run: npm run security:check

      - name: Supply-chain boundary
        run: npm run supply-chain:check

      - name: Test quality boundary
        run: npm run test:quality

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck (TS6 primary)
        run: npm run typecheck

      - name: Typecheck (TS7 compatibility)
        run: npm run typecheck:ts7

      - name: Unit tests + coverage ratchet
        run: npm run test:coverage

      - name: Worker & Durable Object tests
        run: npm run test:workers

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e -- --project=chromium --project=android-portrait --project=onboarding

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Final reliability gate
        run: npm run reliability:check

      - name: Upload certified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  deploy:
    name: Deploy certified Pages artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
