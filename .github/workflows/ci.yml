name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PAGES_ORIGIN: https://cryogenized-spec.github.io

jobs:
  runtime:
    name: Runtime verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Verify runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"

      - name: Documentation integrity
        run: npm run docs:check

      - name: Verification integrity
        run: npm run verify:gates

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck (TS6 primary)
        run: npm run typecheck

      - name: Typecheck (TS7 compatibility)
        run: npm run typecheck:ts7

      - name: Unit tests
        run: npm test

      - name: Worker & Durable Object tests
        run: npm run test:workers

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e -- --project=chromium --project=android-portrait --project=onboarding

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Final reliability gate
        run: npm run reliability:check
