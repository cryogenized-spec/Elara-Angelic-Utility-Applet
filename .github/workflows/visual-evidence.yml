name: Visual Evidence

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number containing the UI change
        required: true
        type: string
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: visual-evidence-pr-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  capture:
    name: Visual evidence
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '/visual-evidence' &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve exact PR SHAs
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_NUMBER="$DISPATCH_PR_NUMBER"
          else
            PR_NUMBER="$COMMENT_PR_NUMBER"
          fi
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Visual evidence requires a numeric pull request number."
            exit 1
          fi
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          STATE="$(jq -r '.state' <<<"$PR_JSON")"
          BASE_SHA="$(jq -r '.base.sha' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          if [[ "$STATE" != "open" || ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Visual evidence requires an open PR with resolvable exact base/head SHAs."
            exit 1
          fi
          {
            echo "pr_number=$PR_NUMBER"
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR head with comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"

      - name: Install head dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Materialize exact base worktree
        shell: bash
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/elara-visual-base" "$BASE_SHA"

      - name: Install base dependencies
        working-directory: ${{ runner.temp }}/elara-visual-base
        run: npm ci --no-audit --no-fund

      - name: Capture base visual evidence
        shell: bash
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          node scripts/capture-visual-evidence.mjs \
            --target "$RUNNER_TEMP/elara-visual-base" \
            --label before \
            --output "$RUNNER_TEMP/elara-visual-evidence" \
            --port 5174 \
            --source-sha "$BASE_SHA" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      - name: Capture head visual evidence
        shell: bash
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          node scripts/capture-visual-evidence.mjs \
            --target "$GITHUB_WORKSPACE" \
            --label after \
            --output "$RUNNER_TEMP/elara-visual-evidence" \
            --port 5175 \
            --source-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      - name: Upload visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-evidence-pr-${{ steps.pr.outputs.pr_number }}-${{ steps.pr.outputs.head_sha }}
          path: ${{ runner.temp }}/elara-visual-evidence/
          retention-days: 7
          if-no-files-found: error
