name: Pass 2 Worker Determinism

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  worker-determinism:
    name: Worker determinism and mutation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Worker suite — 8 consecutive baseline runs
        shell: bash
        run: |
          set -euo pipefail
          for run in $(seq 1 8); do
            echo "=== baseline worker run ${run}/8 ==="
            npm run test:workers
          done

      - name: Worker suite — 7 consecutive runs under build load
        shell: bash
        run: |
          set -euo pipefail
          for run in $(seq 1 7); do
            echo "=== loaded worker run ${run}/7 ==="
            npm run build >"/tmp/pass2-build-${run}.log" 2>&1 &
            build_pid=$!
            npm run test:workers
            wait "${build_pid}"
          done

      - name: Mutation — active completion without structured result must fail
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'worker/test/routine-run-workflow.test.ts';
          const source = fs.readFileSync(path, 'utf8');
          const needle = "body: JSON.stringify({ runKey: claimed.runKey, workflowInstanceId: claimed.workflowInstanceId, result: { disposition: 'noop' } }),";
          const replacement = "body: JSON.stringify({ runKey: claimed.runKey, workflowInstanceId: claimed.workflowInstanceId }),";
          const occurrences = source.split(needle).length - 1;
          if (occurrences !== 1) throw new Error(`Expected exactly one completion mutation anchor, found ${occurrences}.`);
          fs.writeFileSync(path, source.replace(needle, replacement));
          NODE
          if npm exec -- vitest run worker/test/routine-run-workflow.test.ts --config vitest.workers.config.ts -t "completing the same runKey twice is a no-op"; then
            echo "ERROR: missing-result mutation survived."
            exit 1
          else
            echo "Mutation killed: active completion cannot omit its structured result."
          fi
          git checkout -- worker/test/routine-run-workflow.test.ts

      - name: Mutation — wrong scheduler occurrence attribution must fail
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'worker/test/scheduler-record-attribution.test.ts';
          const source = fs.readFileSync(path, 'utf8');
          const needle = 'const secondOccurrence = records.filter((run) => run.scheduledFor === secondDue);';
          const replacement = 'const secondOccurrence = records.filter((run) => run.scheduledFor === intermediateDue);';
          const occurrences = source.split(needle).length - 1;
          if (occurrences !== 1) throw new Error(`Expected exactly one scheduler attribution mutation anchor, found ${occurrences}.`);
          fs.writeFileSync(path, source.replace(needle, replacement));
          NODE
          if npm exec -- vitest run worker/test/scheduler-record-attribution.test.ts --config vitest.workers.config.ts; then
            echo "ERROR: wrong-occurrence attribution mutation survived."
            exit 1
          else
            echo "Mutation killed: the assertion is bound to the exact requested occurrence."
          fi
          git checkout -- worker/test/scheduler-record-attribution.test.ts
